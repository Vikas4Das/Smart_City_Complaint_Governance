<mat-card>
  <h2>My Complaints</h2>

  <table mat-table [dataSource]="complaints">

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let c">{{c.title}}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let c">
        <span [ngClass]="c.status">{{c.status}}</span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['title','status']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['title','status'];"></tr>

  </table>
</mat-card>
