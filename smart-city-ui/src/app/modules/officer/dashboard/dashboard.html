<mat-card>
  <h2>Assigned Complaints</h2>

  <table mat-table [dataSource]="complaints">

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let c">{{c.title}}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let c">
        <mat-select [(value)]="c.status"
          (selectionChange)="updateStatus(c.id,c.status)">
          <mat-option value="PENDING">Pending</mat-option>
          <mat-option value="IN_PROGRESS">In Progress</mat-option>
          <mat-option value="RESOLVED">Resolved</mat-option>
        </mat-select>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['title','status']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['title','status'];"></tr>

  </table>
</mat-card>
